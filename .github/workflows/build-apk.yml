name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Add custom IR plugin sources
        run: |
          PKG_DIR=android/app/src/main/java/kz/remote/universal
          mkdir -p "$PKG_DIR"
          cp android-plugin-src/IrBlasterPlugin.java "$PKG_DIR/IrBlasterPlugin.java"
          cp android-plugin-src/MainActivity.java "$PKG_DIR/MainActivity.java"

      - name: Declare optional IR hardware feature
        run: |
          python3 - <<'PY'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          feature = '    <uses-feature android:name="android.hardware.consumerir" android:required="false" />\n'
          if "consumerir" not in content:
              content = content.replace("</manifest>", feature + "</manifest>")
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ir-remote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
