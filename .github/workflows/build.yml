name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Android SDK
      run: |
        $ANDROID_HOME/build-tools/34.0.0/aapt package -f -m -J . -M AndroidManifest.xml -S . -I $ANDROID_HOME/platforms/android-34/android.jar
        javac -d . -classpath $ANDROID_HOME/platforms/android-34/android.jar MainActivity.java
        $ANDROID_HOME/build-tools/34.0.0/dx --dex --output=classes.dex com/example/pult/*.class
        $ANDROID_HOME/build-tools/34.0.0/aapt package -f -M AndroidManifest.xml -I $ANDROID_HOME/platforms/android-34/android.jar -F app-unsigned.apk .
        $ANDROID_HOME/build-tools/34.0.0/zipalign -f 4 app-unsigned.apk app-aligned.apk
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android app-aligned.apk
        mv app-aligned.apk Pult-Remote.apk
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Pult-APK
        path: Pult-Remote.apk
